name: locotrader
description: LocoTrader — discipline-first trading journal for every day trader.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: ^3.8.0

dependencies:
  flutter:
    sdk: flutter
  google_fonts: ^6.3.1
  shared_preferences: ^2.3.2
  intl: ^0.19.0
  image_picker: ^1.2.1
  path_provider: ^2.1.5
  flutter_local_notifications: ^17.2.4
  timezone: ^0.9.4
  local_auth: ^2.3.0
  flutter_bloc: ^9.1.1
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  provider: ^6.1.5+1
  flutter_secure_storage: ^9.2.2
  google_generative_ai: ^0.4.7
  flutter_dotenv: ^6.0.1
  file_picker: ^11.0.2
  csv: ^6.0.0
  google_mlkit_text_recognition: ^0.13.0
  http: ^1.2.2
  cryptography: ^2.7.0
  share_plus: ^10.1.2
  pdf: ^3.11.0
  # ── Supabase (Auth + DB + Storage) ──
  supabase_flutter: ^2.8.0
  # ── Payments ──
  purchases_flutter: ^10.4.1
  # ── Onboarding / misc ──
  smooth_page_indicator: ^1.2.0+3
  uuid: ^4.5.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1
  flutter_native_splash: ^2.4.1
  build_runner: ^2.14.1
  freezed: ^3.2.3
  json_serializable: ^6.11.2

dependency_overrides:
  material_color_utilities: ^0.12.0

flutter:
  uses-material-design: true
  assets:
    - .env
    - assets/avatar.png

# Run: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/app_icon.png"
  background_color: "#090912"
  theme_color: "#090912"
  adaptive_icon_background: "#090912"
  adaptive_icon_foreground: "assets/app_icon.png"
  remove_alpha_ios: true

# Run: dart run flutter_native_splash:create
# Native splash is intentionally minimal (white only) — Flutter renders the
# polished branded splash itself in lib/ui/splash_screen.dart so we get
# proper sizing, dark/light support, and animation.
flutter_native_splash:
  color: "#FFFFFF"
  color_dark: "#000000"
  android_12:
    color: "#FFFFFF"
    color_dark: "#000000"
  fullscreen: false
