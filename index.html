<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Primary SEO -->
    <title>LocoTrader — Trading Journal App with Pre-Trade Checklists & Edge Analytics</title>
    <meta name="description" content="LocoTrader is a trading journal app that enforces your pre-trade rules, auto-journals every trade, and shows exactly where your edge lives. Forex, crypto, indices, commodities." />
    <meta name="keywords" content="trading journal app, trade journal, forex journal, pre-trade checklist, trading discipline, edge analytics, trading copilot, prop firm challenge, MT4 journal, MT5 journal, crypto trading journal" />
    <meta name="author" content="LocoTrader" />
    <meta name="robots" content="index, follow" />
    <link rel="canonical" href="https://locotrader.com" />

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://locotrader.com" />
    <meta property="og:title" content="LocoTrader — Your edge isn't broken. You're missing a system." />
    <meta property="og:description" content="Pre-trade checklists that lock you out until your rules are met. Auto-journal. Edge analytics. The trading app that enforces discipline." />
    <meta property="og:image" content="https://locotrader.com/og-image.png" />
    <meta property="og:site_name" content="LocoTrader" />

    <!-- Twitter / X -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="LocoTrader — Trading Journal & Pre-Trade Checklist App" />
    <meta name="twitter:description" content="Every trade starts with your rules. Every mistake becomes data. Every week you know what's actually making you money." />
    <meta name="twitter:image" content="https://locotrader.com/og-image.png" />

    <!-- Mobile / App -->
    <meta name="theme-color" content="#090912" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LocoTrader" />

    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.svg" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet" />

    <!-- JSON-LD: SoftwareApplication -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "LocoTrader",
      "applicationCategory": "FinanceApplication",
      "operatingSystem": "Android, iOS",
      "description": "Trading journal app with pre-trade checklists, automated journaling, broker import (MT4, MT5, cTrader, TradingView, Binance), and edge analytics. Designed for day traders who trade forex, crypto, indices, commodities, and stocks.",
      "url": "https://locotrader.com",
      "offers": [
        {
          "@type": "Offer",
          "name": "Free",
          "price": "0",
          "priceCurrency": "USD",
          "description": "30 trades per month, manual logging, pre-trade checklists"
        },
        {
          "@type": "Offer",
          "name": "Pro",
          "price": "7.99",
          "priceCurrency": "USD",
          "description": "Unlimited trades, broker import, AI coach, edge analytics, PDF export"
        },
        {
          "@type": "Offer",
          "name": "Lifetime",
          "price": "49",
          "priceCurrency": "USD",
          "description": "Lifetime Pro access — limited to first 100 members"
        }
      ],
      "keywords": "trading journal, trade journal, forex journal, pre-trade checklist, edge analytics, trading discipline, prop firm challenge tracker",
      "screenshot": "https://locotrader.com/screenshots/photo_2026-07-13_15-11-40.jpg"
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "LocoTrader",
      "url": "https://locotrader.com",
      "logo": "https://locotrader.com/favicon.svg",
      "contactPoint": {
        "@type": "ContactPoint",
        "email": "hello@locotrader.com",
        "contactType": "customer support"
      },
      "sameAs": []
    }
    </script>

    <!-- JSON-LD: WebSite (enables sitelinks search box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "LocoTrader",
      "url": "https://locotrader.com",
      "description": "The trading journal app that enforces your rules, journals every trade automatically, and shows where your edge actually lives."
    }
    </script>

    <!-- JSON-LD: FAQPage (helps appear in Google rich results) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "FAQPage",
      "mainEntity": [
        {
          "@type": "Question",
          "name": "What is LocoTrader?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LocoTrader is a trading journal app with pre-trade checklists, automated trade journaling, broker import, and edge analytics. It helps day traders build discipline and find their edge."
          }
        },
        {
          "@type": "Question",
          "name": "What brokers does LocoTrader support for import?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LocoTrader supports CSV import from MT4, MT5, cTrader, TradingView, Binance, and Bybit."
          }
        },
        {
          "@type": "Question",
          "name": "What markets does LocoTrader support?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LocoTrader supports forex (majors, minors, exotics), indices (NAS100, S&P500, DAX), crypto (BTC, ETH, SOL), commodities (Gold, Oil), and stocks."
          }
        },
        {
          "@type": "Question",
          "name": "Is LocoTrader good for prop firm challenges?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "Yes. LocoTrader includes prop firm profile tracking with drawdown alerts and discipline enforcement that is critical for passing FTMO, TFT, and other prop firm challenges."
          }
        },
        {
          "@type": "Question",
          "name": "How much does LocoTrader cost?",
          "acceptedAnswer": {
            "@type": "Answer",
            "text": "LocoTrader is free for up to 30 trades per month. Pro is $7.99/month or $59.99/year. A limited lifetime Pro option is available for $49."
          }
        }
      ]
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
