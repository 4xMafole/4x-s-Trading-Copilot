    <!-- JSON-LD: HowTo (feeds Google SGE, Perplexity, SearchGPT with step-by-step content) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "HowTo",
      "name": "How to stop revenge trading and build a consistent trading system",
      "description": "A step-by-step process for day traders to replace emotional decision-making with a rule-based system using LocoTrader.",
      "totalTime": "PT5M",
      "supply": [
        { "@type": "HowToSupply", "name": "A trading account (any broker)" },
        { "@type": "HowToSupply", "name": "LocoTrader app (free to start)" }
      ],
      "step": [
        {
          "@type": "HowToStep",
          "name": "Define your trading rules",
          "text": "Write down the conditions that must be met before every trade: timeframe bias, session window, entry confirmation, and risk limits. These become your 'gates'.",
          "position": 1
        },
        {
          "@type": "HowToStep",
          "name": "Set up your pre-trade checklist",
          "text": "In LocoTrader, create your gate checklist or select a template (ICT, SMC, Supply & Demand, Price Action). Each gate is one rule you must verify before entering.",
          "position": 2
        },
        {
          "@type": "HowToStep",
          "name": "Enable Trading Guard on Android",
          "text": "Grant LocoTrader the Accessibility Service permission. Now every time you open your trading app (MT4, MT5, TradingView), your checklist appears on top — forcing a 3-second review before you can proceed.",
          "position": 3
        },
        {
          "@type": "HowToStep",
          "name": "Log every trade with context",
          "text": "After each trade, log the result with setup quality (A+/B/C), trigger type (Plan/FOMO/Revenge), and planned vs actual risk. This feeds your Edge Map over time.",
          "position": 4
        },
        {
          "@type": "HowToStep",
          "name": "Review your Edge Map weekly",
          "text": "Check your Edge Map to see where your statistical edge actually lives — which sessions, setups, and instruments are genuinely profitable. Cut what doesn't work.",
          "position": 5
        }
      ]
    }
    </script>
